<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dummy 采购 BOM</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d1f22;--mute:#6b7076;--line:#e3e3de;--hl:#e8173a;--hlbg:#fde7eb;--done:#2e9e5b;--donebg:#e6f4ec;--warn:#b45309;--warnbg:#fff4e0;--chip:#eef0f2}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--panel:#1f2226;--ink:#e8e9ea;--mute:#9aa0a6;--line:#30343a;--hlbg:#3a1d24;--donebg:#183326;--warnbg:#33270f;--chip:#2a2e33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0}
.tabs button,.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 12px;cursor:pointer;font:inherit}
.tabs button:first-child,.seg button:first-child{border-radius:6px 0 0 6px}
.tabs button:last-child,.seg button:last-child{border-radius:0 6px 6px 0}
.tabs button+button,.seg button+button{border-left:none}
.tabs button.on,.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.prog{margin-left:auto;font-weight:600}
.bar{height:6px;width:160px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--done)}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.controls input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;min-width:220px;background:var(--bg);color:var(--ink);font:inherit}
.controls label{display:flex;gap:5px;align-items:center;cursor:pointer;color:var(--mute)}
.notice{margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:12px 16px 24px}
@media (max-width:980px){main{grid-template-columns:1fr}#boardWrap{position:static!important;order:-1}}
#tableWrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 190px)}
@media (max-width:980px){#tableWrap{max-height:none}}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:8px;border-bottom:1px solid var(--line);z-index:1}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--hlbg) 45%,transparent)}
tr.row.sel td{background:var(--hlbg)}
tr.row.done td{background:var(--donebg)}
tr.row.done .val{text-decoration:line-through;color:var(--mute)}
tr.grp td{background:var(--bg);font-weight:700;font-size:13px;padding:6px 8px;cursor:default}
.cat{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.ori{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;background:#ffedd5;color:#c2410c;border:1px solid #fdba74;white-space:nowrap}
.nori{display:inline-block;margin-top:4px;font-size:11px;color:var(--mute)}
.orit{font-size:12px;color:#c2410c;font-weight:600;margin-bottom:3px}
@media (prefers-color-scheme:dark){.ori{background:#431407;color:#fdba74;border-color:#9a3412}.orit{color:#fdba74}}
.controls select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.stg{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap}
.refs{display:flex;flex-wrap:wrap;gap:3px}
.chip{background:var(--chip);border-radius:4px;padding:0 5px;font-size:12px;font-family:Consolas,monospace;cursor:pointer}
.chip.on{background:var(--hl);color:#fff}
.val{font-weight:600}
.fp{color:var(--mute);font-size:12px}
.src{font-size:12px}
.src b{font-weight:600}
.mute{color:var(--mute);font-size:12px}
.spare0{color:var(--hl);font-weight:700}
.note{font-size:12px;margin-top:2px}
.note.bad{color:var(--hl);font-weight:600}
.note .r{font-family:Consolas,monospace;font-weight:700;margin-right:3px}
input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--done)}
#boardWrap{position:sticky;top:120px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
#boardTop{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
#cv{width:100%;display:block;border-radius:8px;background:#0f1a14;touch-action:manipulation}
#info{min-height:44px;margin-top:8px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
</style>
</head>
<body>
<header>
  <h1>Dummy 采购 BOM</h1>
  <div class="tabs" id="tabs"></div>
  <div class="prog"><span id="progTxt"></span><span class="bar"><i id="progBar"></i></span></div>
</header>
<div class="controls">
  <input type="search" id="q" placeholder="搜位号 / 值 / 类型 / 立创编号，如 R13、10K、电感、C60490">
  <div class="seg" id="sideSeg"><button data-v="all" class="on">全部</button><button data-v="F">正面</button><button data-v="B">背面</button></div>
  <label id="powerLbl"><input type="checkbox" id="power"> 只看电源部分（流程 B 第一步）</label>
  <select id="cat" aria-label="按类型筛选"><option value="">全部类型</option></select>
  <label><input type="checkbox" id="hideDone"> 隐藏已焊</label>
  <label><input type="checkbox" id="onlyNotes"> 只看有注意事项的</label>
  <label style="color:#c2410c;font-weight:600"><input type="checkbox" id="onlyOri"> 只看要注意方向的</label>
</div>
<div class="notice" id="notice"></div>
<main>
  <div id="tableWrap"><table><thead><tr><th style="width:34px">焊好</th><th style="width:96px">类型</th><th>位号</th><th>值 / 封装</th><th>我买的料</th><th style="width:70px">板上数 / 余量</th><th>注意</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div id="boardWrap">
    <div id="boardTop">
      <div class="seg" id="viewSeg"><button data-v="both" class="on">双面</button><button data-v="F">正面</button><button data-v="B">背面</button></div>
      <label class="mute"><input type="checkbox" id="allRefs"> 显示全部位号</label>
      <label class="mute"><input type="checkbox" id="marks" checked> 显示方向标记</label>
      <div class="legend"><span style="--c:#e8173a">选中</span><span style="--c:#2e9e5b">已焊</span><span style="--c:#c9b37a">未焊</span><span style="--c:#ffd400">1 脚</span><span style="--c:#ffd400">K = 二极管负极</span><span style="--c:#ffd400">+ = 电解电容正极</span></div>
    </div>
    <canvas id="cv"></canvas>
    <div id="info" class="mute">点表格的一行，或点板图上的元件。背面是翻过来看的样子。</div>
  </div>
</main>

const NOTICE = {
  motor:'流程 A（一次回流）：① 正面所有贴片一次上加热台（K1/K2/S1 除外）→ 第一次上电先用 9V 测 T1≈5.2V、T2=3.3V → ② 背面 → ③ 插座 → ④ 最后焊 K1/K2/S1。采购表「对应位号」列多是 REF 板的编号，分料以本页为准。',
  REF:'REF 板焊接顺序还没规划，这里按正面 / 背面列出。⛔ R27 不焊（R27 和 R29 二选一，灯环要 5V 只焊 R29）。采购表「对应位号」列以本页为准。'
};
let board='42', side='all', view='both', sel=new Set(), q='';
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=new Set(store.get('dummybom:done:'+board)||[]);
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const rowKey=r=>r.refs.join(',');

function initTabs(){
  $('tabs').innerHTML=BOARDS.map(([k,n])=>`<button data-k="${k}" class="${k===board?'on':''}">${n}</button>`).join('');
  $('tabs').onclick=e=>{const k=e.target.dataset.k;if(!k)return;board=k;sel.clear();done=new Set(store.get('dummybom:done:'+board)||[]);
    [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));render();};
}
function segs(id,cb){$(id).onclick=e=>{const v=e.target.dataset.v;if(!v)return;[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));cb(v);}}

function filtered(){
  const D=DATA[board], qq=q.trim().toLowerCase();
  return D.rows.filter(r=>{
    if(side!=='all'&&r.side!==side)return false;
    if($('power').checked&&!r.power)return false;
    if($('hideDone').checked&&done.has(rowKey(r)))return false;
    if($('onlyNotes').checked&&!r.notes.length)return false;
    if($('cat').value&&r.cat!==$('cat').value)return false;
    if($('onlyOri').checked&&r.ori!=='yes')return false;
    if(!qq)return true;
    const hay=(r.cat+' '+r.sub+' '+r.refs.join(' ')+' '+r.value+' '+r.fp+' '+r.src+' '+r.part+' '+r.brand+' '+r.desc).toLowerCase();
    return qq.split(/\s+/).every(t=>t.split(',').some(x=>x&&hay.includes(x)) || r.refs.some(x=>x.toLowerCase()===t));
  });
}
function render(){
  const D=DATA[board];
  $('notice').textContent=board==='REF'?NOTICE.REF:NOTICE.motor;
  $('powerLbl').style.display=board==='REF'?'none':'';
  const cats=[...new Set(D.rows.map(r=>r.cat))].sort((a,b)=>Object.keys(CATC).indexOf(a)-Object.keys(CATC).indexOf(b)); const cs=$('cat'), cur=cs.value;
  cs.innerHTML='<option value="">全部类型</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join(''); if(!cats.includes(cur))cs.value='';
  const rows=filtered(); let html='', last='';
  for(const r of rows){
    if(r.stage!==last){last=r.stage;const [t,c]=STG[r.stage];html+=`<tr class="grp"><td colspan="7"><span class="stg" style="background:${c}">${t}</span></td></tr>`;}
    const k=rowKey(r), isDone=done.has(k), isSel=r.refs.some(x=>sel.has(x));
    const chips=r.refs.map(x=>`<span class="chip ${sel.has(x)?'on':''}" data-ref="${x}">${x}</span>`).join('');
    const isTaobao=!r.src.startsWith('立创');
    const src=`<div class="src"><b>${esc(r.part)}</b> · ${esc(r.brand)}</div><div class="mute">${esc(r.src)}${isTaobao?'':''}</div><div class="mute">${esc(r.desc)}</div>`;
    const how=r.how?`<div class="mute">焊法：${esc(r.how)}${r.side==='B'?'（背面）':''}</div>`:`<div class="mute">${r.side==='B'?'背面':'正面'}</div>`;
    const notes=r.notes.map(n=>`<div class="note ${/⛔|⚠/.test(n.t)?'bad':''}"><span class="r">${esc(n.r)}</span>${esc(n.t)}</div>`).join('');
    html+=`<tr class="row ${isDone?'done':''} ${isSel?'sel':''}" data-k="${esc(k)}">
      <td><input type="checkbox" ${isDone?'checked':''} data-done="${esc(k)}" aria-label="标记已焊"></td>
      <td><span class="cat" style="background:${CATC[r.cat]||'#636e72'}">${esc(r.cat)}</span><div class="sub">${esc(r.sub)}</div>${r.ori==='yes'?'<span class="ori">⚠ 注意方向</span>':'<span class="nori">不分方向</span>'}</td>
      <td><div class="refs">${chips}</div></td>
      <td><div class="val">${esc(r.value)}</div><div class="fp">${esc(r.fp)}</div>${how}</td>
      <td>${src}</td>
      <td>${r.refs.length}<div class="${r.spare===0?'spare0':'mute'}">余 ${r.spare}</div></td>
      <td>${r.ori==='yes'?`<div class="orit">🧭 ${esc(r.orit)}</div>`:''}${notes}</td></tr>`;
  }
  $('tb').innerHTML=html||'<tr><td colspan="7" class="mute" style="padding:20px">没有匹配的元件</td></tr>';
  const total=D.rows.reduce((a,r)=>a+r.refs.length,0), d=D.rows.filter(r=>done.has(rowKey(r))).reduce((a,r)=>a+r.refs.length,0);
  $('progTxt').textContent=`已焊 ${d} / ${total}`; $('progBar').style.width=(total?d/total*100:0)+'%';
  draw();
}
$('tb').addEventListener('click',e=>{
  const cb=e.target.closest('input[data-done]');
  if(cb){const k=cb.dataset.done; cb.checked?done.add(k):done.delete(k); store.set('dummybom:done:'+board,[...done]); render(); return;}
  const chip=e.target.closest('.chip');
  if(chip){sel=new Set([chip.dataset.ref]); render(); showInfo(); return;}
  const tr=e.target.closest('tr.row'); if(!tr)return;
  const r=DATA[board].rows.find(x=>rowKey(x)===tr.dataset.k);
  const same=r.refs.length===sel.size&&r.refs.every(x=>sel.has(x));
  sel=same?new Set():new Set(r.refs); render(); showInfo();
});
function rowOf(ref){return DATA[board].rows.find(r=>r.refs.includes(ref))}
function showInfo(){
  if(!sel.size){$('info').innerHTML='点表格的一行，或点板图上的元件。背面是翻过来看的样子。';return}
  const r=rowOf([...sel][0]); if(!r)return;
  const sides=[...new Set(DATA[board].fps.filter(f=>sel.has(f.r)).map(f=>f.L==='F'?'正面':'背面'))].join('、');
  $('info').innerHTML=`<b>${esc([...sel].join(' '))}</b>　【${esc(r.sub)}】${esc(r.value)} · ${esc(r.fp)} · 在${sides}<br>${esc(r.part)}（${esc(r.src)}）`;
}

// ---------- board drawing ----------
const cv=$('cv'), ctx=cv.getContext('2d'); let panels=[];
function layout(){
  const D=DATA[board], bb=D.bbox, bw=bb.maxx-bb.minx, bh=bb.maxy-bb.miny;
  const W=cv.clientWidth, n=view==='both'?2:1, m=14, gap=view==='both'?16:0;
  const s=Math.min((W-2*m-gap)/(n*bw), 620/bh);
  const H=Math.round(bh*s+2*m+18);
  const dpr=window.devicePixelRatio||1; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.height=H+'px';
  const sidesToDraw=view==='both'?['F','B']:[view];
  const pw=bw*s; const total=n*pw+gap; const x0=(W-total)/2;
  panels=sidesToDraw.map((sd,i)=>({side:sd,s,dpr,ox:x0+i*(pw+gap),oy:m+18,bb}));
}
function setX(p){const {s,dpr,ox,oy,bb}=p; if(p.side==='F')ctx.setTransform(dpr*s,0,0,dpr*s,dpr*(ox-bb.minx*s),dpr*(oy-bb.miny*s)); else ctx.setTransform(-dpr*s,0,0,dpr*s,dpr*(ox+bb.maxx*s),dpr*(oy-bb.miny*s));}
function toScreen(p,x,y){return p.side==='F'?[p.ox+(x-p.bb.minx)*p.s,p.oy+(y-p.bb.miny)*p.s]:[p.ox+(p.bb.maxx-x)*p.s,p.oy+(y-p.bb.miny)*p.s]}
function toWorld(p,X,Y){return p.side==='F'?[(X-p.ox)/p.s+p.bb.minx,(Y-p.oy)/p.s+p.bb.miny]:[p.bb.maxx-(X-p.ox)/p.s,(Y-p.oy)/p.s+p.bb.miny]}
function rr(x,y,w,h,r){ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2))); else ctx.rect(x,y,w,h);}
function drawPad(pd){
  ctx.save(); ctx.translate(pd.p[0],pd.p[1]); ctx.rotate(-pd.a*Math.PI/180);
  const [w,h]=pd.s;
  if(pd.sh==='circle'){ctx.beginPath();ctx.arc(0,0,w/2,0,2*Math.PI);}
  else if(pd.sh==='oval')rr(-w/2,-h/2,w,h,Math.min(w,h)/2);
  else if(pd.sh==='roundrect')rr(-w/2,-h/2,w,h,pd.rr||Math.min(w,h)*.25);
  else {ctx.beginPath();ctx.rect(-w/2,-h/2,w,h);}
  ctx.fill(); ctx.restore();
}
function draw(){
  layout(); const D=DATA[board];
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const doneRefs=new Set(); D.rows.forEach(r=>{if(done.has(rowKey(r)))r.refs.forEach(x=>doneRefs.add(x))});
  for(const p of panels){
    ctx.setTransform(p.dpr,0,0,p.dpr,0,0); ctx.fillStyle='#cfd6d1'; ctx.font='600 13px "Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.side==='F'?'正面 TOP':'背面 BOTTOM（翻过来看）',p.ox+(p.bb.maxx-p.bb.minx)*p.s/2,14);
    setX(p);
    // board outline
    const bb=p.bb; ctx.fillStyle='#1f5e3a'; rr(bb.minx,bb.miny,bb.maxx-bb.minx,bb.maxy-bb.miny,2.5); ctx.fill();
    ctx.strokeStyle='#8fa89a'; ctx.lineWidth=.2;
    for(const e of D.edges){ctx.beginPath(); if(e.t==='s'){ctx.moveTo(...e.a);ctx.lineTo(...e.b)} else if(e.t==='a'){ctx.arc(e.c[0],e.c[1],e.r,e.s0*Math.PI/180,e.s1*Math.PI/180)} else ctx.arc(e.c[0],e.c[1],e.r,0,2*Math.PI); ctx.stroke();}
    // silkscreen
    ctx.strokeStyle='rgba(240,240,240,.85)'; ctx.fillStyle='rgba(240,240,240,.85)'; ctx.lineCap='round';
    for(const s of D.silk[p.side]){
      if(s.t==='s'){ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(...s.a);ctx.lineTo(...s.b);ctx.stroke()}
      else if(s.t==='a'){ctx.lineWidth=s.w;ctx.beginPath();ctx.arc(s.c[0],s.c[1],s.r,s.s0*Math.PI/180,s.s1*Math.PI/180);ctx.stroke()}
      else if(s.t==='c'){ctx.lineWidth=s.w;ctx.beginPath();ctx.arc(s.c[0],s.c[1],s.r,0,2*Math.PI);s.f?ctx.fill():ctx.stroke()}
      else if(s.t==='p'){try{ctx.fill(new Path2D(s.d))}catch(e){}}
    }
    // pads
    for(const f of D.fps){
      const onSide=f.L===p.side;
      for(const pd of f.pads){
        if(!(pd.t==='th'||pd.l.includes(p.side)))continue;
        const isSel=sel.has(f.r), isDone=doneRefs.has(f.r);
        ctx.fillStyle=isSel?'#e8173a':isDone?'#2e9e5b':(onSide||pd.t==='th')?'#c9b37a':'#6f7d74';
        drawPad(pd);
        if((isSel||($('marks').checked&&f.mk==='ic'&&onSide))&&pd['1']&&f.pads.length>2){ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(pd.p[0],pd.p[1],Math.min(pd.s[0],pd.s[1])*.42,0,2*Math.PI);ctx.fill();}
      }
      if(sel.has(f.r)&&onSide){
        const b=f.b; ctx.save(); ctx.translate(b.p[0],b.p[1]); ctx.rotate(-b.a*Math.PI/180); ctx.translate(b.rp[0],b.rp[1]);
        ctx.strokeStyle='#ff4d6d'; ctx.lineWidth=.25; ctx.strokeRect(-.3,-.3,b.s[0]+.6,b.s[1]+.6); ctx.restore();
      }
    }
    // labels
    ctx.setTransform(p.dpr,0,0,p.dpr,0,0); ctx.textAlign='center'; ctx.textBaseline='middle';
    if($('marks').checked){
      for(const f of D.fps){
        if(f.L!==p.side||!(f.mk==='diode'||f.mk==='ecap')||f.pads.length!==2)continue;
        const pd=f.mk==='diode'?f.pads.find(x=>!x['1']):f.pads.find(x=>x['1']); if(!pd)continue;
        const [X,Y]=toScreen(p,pd.p[0],pd.p[1]); const sz=Math.max(11,Math.min(18,p.s*1.1));
        ctx.font=`900 ${sz}px "Microsoft YaHei",sans-serif`; ctx.lineWidth=3.5; ctx.strokeStyle='#000'; ctx.fillStyle='#ffd400';
        const txt=f.mk==='diode'?'K':'+'; ctx.strokeText(txt,X,Y); ctx.fillText(txt,X,Y);
      }
    }
    for(const f of D.fps){
      if(f.L!==p.side)continue;
      const isSel=sel.has(f.r); if(!isSel&&!$('allRefs').checked)continue;
      const [X,Y]=toScreen(p,f.c[0],f.c[1]);
      ctx.font=(isSel?'700 13px':'500 10px')+' Consolas,monospace'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.85)'; ctx.fillStyle=isSel?'#fff':'#dfe6e2';
      ctx.strokeText(f.r,X,Y); ctx.fillText(f.r,X,Y);
    }
  }
}
cv.addEventListener('click',e=>{
  const rect=cv.getBoundingClientRect(), X=e.clientX-rect.left, Y=e.clientY-rect.top;
  const p=panels.find(p=>{const w=(p.bb.maxx-p.bb.minx)*p.s;return X>=p.ox&&X<=p.ox+w}); if(!p)return;
  const [x,y]=toWorld(p,X,Y); let hit=null, best=1e9;
  for(const f of DATA[board].fps){
    if(f.L!==p.side&&!f.pads.some(pd=>pd.t==='th'))continue;
    const b=f.b, a=b.a*Math.PI/180, dx=x-b.p[0], dy=y-b.p[1];
    const lx=dx*Math.cos(a)-dy*Math.sin(a)-b.rp[0], ly=dx*Math.sin(a)+dy*Math.cos(a)-b.rp[1];
    if(lx>=0&&ly>=0&&lx<=b.s[0]&&ly<=b.s[1]){const area=b.s[0]*b.s[1]; if(area<best){best=area;hit=f}}
  }
  if(!hit){sel.clear();render();showInfo();return}
  sel=new Set([hit.r]); render(); showInfo();
  const tr=[...document.querySelectorAll('tr.row')].find(t=>t.dataset.k.split(',').includes(hit.r)); if(tr)tr.scrollIntoView({block:'center',behavior:'smooth'});
});
$('q').oninput=e=>{q=e.target.value;
  const t=q.trim().toUpperCase(); if(DATA[board].fps.some(f=>f.r.toUpperCase()===t)){sel=new Set([DATA[board].fps.find(f=>f.r.toUpperCase()===t).r]);}
  render();showInfo()};
['power','hideDone','onlyNotes','cat','onlyOri'].forEach(id=>$(id).onchange=render);
$('marks').onchange=draw;
$('allRefs').onchange=draw;
segs('sideSeg',v=>{side=v;render()}); segs('viewSeg',v=>{view=v;draw()});
window.addEventListener('resize',draw);
initTabs(); render();
</script>
</body>
</html>
